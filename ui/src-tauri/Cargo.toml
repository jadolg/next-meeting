[package]
name = "next-meeting-ui"
version = "0.1.0"
description = "Cross-platform interactive desktop UI powered by the next-meeting CLI"
authors = ["Next Meeting Contributors"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "next_meeting_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds `../dist` by default so standalone debug/release binaries never depend on `localhost:1420`.
# `tauri dev` passes `--no-default-features` automatically to enable Vite HMR.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
